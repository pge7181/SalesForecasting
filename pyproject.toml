[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "state-sales-forecasting-service"
version = "0.1.0"
description = "Production-style weekly sales forecasting service with model selection and FastAPI."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "prophet>=1.1",
  "xgboost>=2.0",
  "tensorflow>=2.15",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "holidays>=0.44",
  "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
